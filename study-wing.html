<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Study Wing | Martha's Atrium</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&family=Cormorant+SC:wght@600&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --burgundy: #2C0A0A;
            --gold: #D4AF37;
            --gold-dim: #8B7355;
            --stone: #3A3A3A;
            --teal-patina: #2F4F4F;
            --deep-navy: #0F1419;
            --cream: #F5F0E8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            background:
                linear-gradient(
                    180deg,
                    #050505 0%,
                    #1a0a0a 40%,
                    #0f0505 100%
                );
            color: var(--cream);
            font-family: 'Cormorant Garamond', serif;
            height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            position: relative;
        }

        /* =========================================
           ATMOSPHERE
           ========================================= */

        .atmosphere {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(
                    circle at 20% 50%,
                    rgba(139, 0, 0, 0.1) 0%,
                    transparent 40%
                ),
                radial-gradient(
                    circle at 80% 50%,
                    rgba(212, 175, 55, 0.05) 0%,
                    transparent 40%
                );
            pointer-events: none;
            z-index: 1;
        }

        /* =========================================
           ACT I: THE CURTAIN
           ========================================= */

        #curtain {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            animation: curtainRise 2s ease-out 5s forwards;
        }

        .wing-title {
            font-family: 'Cinzel', serif;
            font-size: clamp(2.5rem, 8vw, 5rem);
            color: var(--gold);
            letter-spacing: 0.6em;
            text-transform: uppercase;
            opacity: 0;
            filter: blur(10px);
            animation: titleReveal 4s ease-out 0.5s forwards;
            text-align: center;
        }

        .wing-subtitle {
            position: absolute;
            bottom: 35%;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1rem;
            color: var(--gold-dim);
            letter-spacing: 0.3em;
            opacity: 0;
            animation: fadeIn 2s ease-out 2.5s forwards;
            text-align: center;
        }

        @keyframes titleReveal {
            0% {
                opacity: 0;
                filter: blur(10px);
                transform: translateY(30px);
            }

            30%,
            70% {
                opacity: 1;
                filter: blur(0);
                transform: translateY(0);
            }

            100% {
                opacity: 0;
                filter: blur(5px);
                transform: translateY(-30px);
            }
        }

        @keyframes curtainRise {
            to {
                transform: translateY(-100%);
                opacity: 0;
                visibility: hidden;
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        /* =========================================
           ACT II: THE THOUGHT
           ========================================= */

        #thought-stage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 900px;
            text-align: center;
            z-index: 10;
            opacity: 0;
            animation: fadeIn 1s ease-out 6s forwards;
        }

        .epigraph {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            color: var(--gold-dim);
            letter-spacing: 0.5em;
            text-transform: uppercase;
            margin-bottom: 3rem;
            display: block;
        }

        #typewriter {
            font-size: clamp(1.5rem, 3vw, 2.2rem);
            line-height: 1.8;
            color: var(--cream);
            font-weight: 300;
            letter-spacing: 0.03em;
            min-height: 150px;
            font-family: 'Cormorant Garamond', serif;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: var(--gold);
            margin-left: 5px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        /* =========================================
           EXIT INTO READING ROOM
           ========================================= */

        .fade-out {
            animation: fadeAway 2s ease-out forwards;
        }

        @keyframes fadeAway {
            to {
                opacity: 0;
                transform: translate(-50%, -60%);
                visibility: hidden;
            }
        }

        /* =========================================
           KEY NAVIGATION
           ========================================= */

        #atrium-key {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 50;
            width: 60px;
            height: 60px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .key-icon {
            width: 40px;
            height: 40px;
            border: 2px solid var(--gold-dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--gold);
            transition: all 0.3s;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        #atrium-key:hover .key-icon {
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
            transform: rotate(90deg);
        }

        .key-menu {
            position: absolute;
            bottom: 70px;
            right: 0;
            background: rgba(15, 20, 25, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 1.5rem;
            min-width: 280px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px);
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        #atrium-key.active .key-menu {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .key-menu h4 {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            color: var(--gold);
            letter-spacing: 0.3em;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 0.5rem;
            text-transform: uppercase;
        }

        .wing-link {
            display: block;
            padding: 0.7rem 0;
            color: var(--cream);
            text-decoration: none;
            font-size: 0.95rem;
            transition: all 0.3s;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-family: 'Cormorant Garamond', serif;
        }

        .wing-link:hover {
            color: var(--gold);
            padding-left: 10px;
        }

        .wing-link::before {
            content: '→ ';
            opacity: 0.5;
            font-size: 0.8rem;
        }

        .wing-link.atrium {
            margin-top: 0.5rem;
            border-top: 1px solid rgba(212, 175, 55, 0.3);
            border-bottom: none;
            color: var(--gold-dim);
            font-size: 0.85rem;
        }

        .wing-link.atrium:hover {
            color: var(--gold);
        }

        /* =========================================
           MOBILE
           ========================================= */

        @media (max-width: 768px) {
            #typewriter {
                font-size: 1.2rem;
                line-height: 1.6;
            }

            .wing-title {
                font-size: 2rem;
                letter-spacing: 0.3em;
            }

            .wing-subtitle {
                font-size: 0.85rem;
                letter-spacing: 0.2em;
                width: 90%;
            }

            .epigraph {
                font-size: 0.6rem;
                letter-spacing: 0.3em;
                margin-bottom: 2rem;
            }

            #thought-stage {
                width: 88%;
            }

            #atrium-key {
                bottom: 1rem;
                right: 50%;
                transform: translateX(50%);
            }

            .key-menu {
                right: 50%;
                transform: translateX(50%) translateY(10px);
                min-width: 240px;
            }

            #atrium-key.active .key-menu {
                transform: translateX(50%) translateY(0);
            }
        }

        @media (max-width: 480px) {
            .wing-title {
                font-size: 1.7rem;
                letter-spacing: 0.25em;
            }

            .wing-subtitle {
                font-size: 0.78rem;
                letter-spacing: 0.16em;
            }

            #typewriter {
                font-size: 1.1rem;
                line-height: 1.65;
            }

            .epigraph {
                font-size: 0.55rem;
                letter-spacing: 0.25em;
            }
        }

        /* =========================================
           REDUCED MOTION
           ========================================= */

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <div class="atmosphere"></div>

    <!-- =========================================
         OPENING CURTAIN
         ========================================= -->

    <div id="curtain">
        <h1 class="wing-title">Study Wing</h1>
        <p class="wing-subtitle">Where patterns become visible</p>
    </div>

    <!-- =========================================
         TYPEWRITER INTRO
         After it finishes, the visitor is taken
         directly into the Reading Room.
         ========================================= -->

    <div id="thought-stage">
        <span class="epigraph">Pattern Thought · 001</span>

        <div id="typewriter"></div>

        <span class="cursor"></span>
    </div>

    <!-- =========================================
         KEY NAVIGATION
         ========================================= -->

    <div id="atrium-key" onclick="toggleKey()">
        <div class="key-icon">⚷</div>

        <div class="key-menu">
            <h4>Navigate Martha's Atrium</h4>

            <a href="glam-wing.html" class="wing-link">
                Glam Wing (Methodology)
            </a>

            <a href="observatory-wing.html" class="wing-link">
                Observatory Wing (Process)
            </a>

            <a href="salon-wing.html" class="wing-link">
                Salon Wing (Coven)
            </a>

            <a href="index.html" class="wing-link atrium">
                ← Return to The Atrium
            </a>
        </div>
    </div>

    <script>
        /* =========================================
           TYPEWRITER
           ========================================= */

        const text =
            "The body remembers what the mind forgets. In the space between clinical protocol and silk drape, we find the pattern: structure is not the enemy of intuition, but its architecture. Notice where your attention rests without effort—that is the door.";

        const typewriter = document.getElementById('typewriter');

        const thoughtStage = document.getElementById('thought-stage');

        let index = 0;

        function type() {
            if (index < text.length) {
                typewriter.textContent += text.charAt(index);

                index++;

                setTimeout(
                    type,
                    Math.random() * 40 + 30
                );

            } else {

                /*
                 * Typing finished.
                 *
                 * Preserve the pause from the original
                 * experience, then fade the thought away.
                 */

                setTimeout(() => {

                    thoughtStage.classList.add('fade-out');

                    /*
                     * There is no longer a three-door screen.
                     *
                     * Once the thought has faded, the Study
                     * Wing opens directly into the Reading Room.
                     */

                    setTimeout(() => {
                        window.location.href = 'reading-room.html';
                    }, 1800);

                }, 2000);
            }
        }

        /*
         * Start typing after the curtain begins
         * to rise, matching the original timing.
         */

        setTimeout(type, 6500);


        /* =========================================
           KEY NAVIGATION
           ========================================= */

        function toggleKey() {
            const key =
                document.getElementById('atrium-key');

            key.classList.toggle('active');
        }


        /*
         * Close key navigation when clicking
         * anywhere outside it.
         */

        document.addEventListener('click', (event) => {

            const key =
                document.getElementById('atrium-key');

            if (
                key &&
                !key.contains(event.target)
            ) {
                key.classList.remove('active');
            }
        });
    </script>

</body>
</html>
